name: Daily US Stock Report

on:
  schedule:
    # 1. 每 2 個小時整點執行一次（抓取 Yahoo 經濟/政治/戰爭/民生即時新聞）
    - cron: '0 */2 * * *'

    # 2. 每天早上 09:00 HKT (UTC 01:00) - 前日收盤完整報告與走勢圖
    - cron: '0 1 * * *'

    # 3. 冬令時間開盤 1 小時後：香港時間週一至週五 23:30 (UTC 15:30)
    - cron: '30 15 * * 1-5'

    # 4. 夏令時間開盤 1 小時後：香港時間週一至週五 22:30 (UTC 14:30)
    - cron: '30 14 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: '選擇測試模式 (morning / intraday / news)'
        required: true
        default: 'morning'

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance feedparser matplotlib

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            MODE="morning"
          elif [ "${{ github.event.schedule }}" = "30 15 * * 1-5" ] || [ "${{ github.event.schedule }}" = "30 14 * * 1-5" ]; then
            MODE="intraday"
          else
            MODE="news"
          fi
          python report.py "$MODE"
